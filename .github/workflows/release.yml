name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        env:
          TRAFFICBAR_VERSION: ${{ github.ref_name }}
          TRAFFICBAR_GITHUB_REPOSITORY: ${{ github.repository }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          VERSION="${TRAFFICBAR_VERSION#v}"
          TRAFFICBAR_VERSION="$VERSION" scripts/package-release.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/TrafficBar-macos-*.dmg \
            dist/TrafficBar-macos-*.tar.gz \
            dist/appcast.xml \
            --repo "${{ github.repository }}" \
            --title "流量管家 ${GITHUB_REF_NAME#v}" \
            --generate-notes
